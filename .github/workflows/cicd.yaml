name: Build and push docker image

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Check out the repository
      uses: actions/checkout@v2


    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_SECRET_ID }}
        aws-secret-access-key: ${{ secrets.AWS_ACCESS_SECRET_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
        
# Login to ECR
#=============
    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2


    - name: Docker build 
      run: |
        docker build -t netflix-frontend:latest .

    - name: Docker push
      run: |
        docker tag netflix-frontend:latest 423716046426.dkr.ecr.us-east-1.amazonaws.com/netflix-frontend:v${GITHUB_RUN_NUMBER}
        docker push 423716046426.dkr.ecr.us-east-1.amazonaws.com/netflix-frontend:v${GITHUB_RUN_NUMBER}
